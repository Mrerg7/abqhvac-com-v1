name = "abqhvac-com-v1"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "abqhvac.com", custom_domain = true },
  { pattern = "www.abqhvac.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "force-trailing-slash"
